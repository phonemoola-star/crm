# Publish pipeline (runs on every push to main, or manually):
#  1. Decode icons-b64/*.b64 -> icons/*.png and verify checksums (binary files can't be pushed through
#     the text-only API used to publish), committing them if they changed.
#  2. Mirror main to the gh-pages branch, which GitHub Pages serves at https://phonemoola-star.github.io/crm/
name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify icons
        run: |
          mkdir -p icons
          for f in icons-b64/*.b64; do base64 -d "$f" > "icons/$(basename "$f" .b64)"; done
          sha256sum -c icons-b64/SHA256SUMS
      - name: Commit icons if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons
          git diff --cached --quiet && echo "icons unchanged" || (git commit -m "Decode PNG icons" && git push origin HEAD:main)
      - name: Mirror main to gh-pages
        run: git push --force origin HEAD:gh-pages
